# ─────────────────────────────────────────────────────────────────────
#  GitHub Actions CI for ansys-maxwell-motor
#
#  Pipeline:
#    1. Lint (ruff) — fast fail on style / common bugs
#    2. Type-check (mypy, non-blocking — strict mode off)
#    3. Test (pytest + coverage) — must pass on all OS × Python combos
#    4. Build — verify pyproject.toml + sdist/wheel
#    5. Smoke test — import the package and run the canonical CLI
#
#  This pipeline does NOT run Maxwell (no ansysedt in CI).
#  Integration tests that require Maxwell are skipped via the
#  `requires_maxwell` marker.
# ─────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs for the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # ──────────────────────────────────────────────────────────────────
  #  1. Lint (fast fail)
  # ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install ruff
        run: pip install --upgrade "ruff>=0.1.0"

      - name: Check formatting
        run: ruff format --check scripts tests examples

      - name: Lint
        run: ruff check scripts tests examples

  # ──────────────────────────────────────────────────────────────────
  #  2. Type-check (non-blocking)
  # ──────────────────────────────────────────────────────────────────
  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true   # type hints are progressive, not blocking
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions.setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install mypy
        run: pip install --upgrade "mypy>=1.7" "types-PyYAML"

      - name: Type-check scripts/
        run: mypy scripts/

  # ──────────────────────────────────────────────────────────────────
  #  3. Test matrix (Linux / macOS / Windows × Python 3.10-3.13)
  # ──────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest with coverage
        run: |
          pytest --cov=scripts --cov-report=xml --cov-report=term-missing -v
        shell: bash

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ──────────────────────────────────────────────────────────────────
  #  4. Build (verify pyproject.toml + sdist/wheel are valid)
  # ──────────────────────────────────────────────────────────────────
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions.setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install build
        run: pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify sdist contents
        run: |
          python -m tarfile -l dist/*.tar.gz | head -30

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  #  5. Smoke test (import + run canonical CLI on a fresh install)
  # ──────────────────────────────────────────────────────────────────
  smoke:
    name: Smoke test (CLI works after pip install)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Verify CLI entry points
        run: |
          maxwell-winding --all | head -10
          maxwell-test
