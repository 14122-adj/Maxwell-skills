[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ansys-maxwell-motor"
version = "4.4.0"
description = "ANSYS Maxwell motor modeling + multiphysics MDAO orchestration skill — 19 canonical pole-slot winding layouts, Maxwell COM API bridge, 10 simulation types, NSGA-II optimization, IGBT reliability workflow"
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE"]
authors = [
    { name = "Maxwell Skill Maintainers" },
]
keywords = [
    "ansys",
    "maxwell",
    "motor",
    "pmsm",
    "fem",
    "electromagnetic",
    "winding",
    "multiphysics",
    "mdao",
    "igbt",
    "reliability",
    "optimization",
    "nsga2",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Software Development :: Code Generators",
]
requires-python = ">=3.10"

# Core runtime dependencies.
# numpy + matplotlib are required by the 25 N·m SPMSM design chain shipped in
# projects/25Nm_PMSM/ (sim_analytical.py, thermal_analysis.py, nvh_analysis.py,
# sensitivity_*.py, make_report.py). They MUST live here rather than in an extra:
# `pip install -e .` alone has to be enough to regenerate REPORT_25Nm_SPMSM.html,
# otherwise a clean venv dies at `import matplotlib` (audit item P2 / G2).
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Maxwell COM bridge (Windows + pywin32 only)
mcp = [
    "pywin32>=306; sys_platform == 'win32'",
]
# MDAO (sqlite + optional pyansys)
mdao = [
]
# Visualization — kept as a backward-compatible alias; matplotlib/numpy are now
# core dependencies, so `pip install -e ".[plot]"` is equivalent to `-e .`
plot = [
    "matplotlib>=3.7",
    "numpy>=1.24",
]
# All-in-one
all = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pywin32>=306; sys_platform == 'win32'",
]
# Dev tooling
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "mypy>=1.7",
    "types-PyYAML",
]

[project.urls]
"Homepage" = "https://github.com/Torry/ansys-maxwell-motor-skill"
"Bug Tracker" = "https://github.com/Torry/ansys-maxwell-motor-skill/issues"
"Documentation" = "https://github.com/Torry/ansys-maxwell-motor-skill/blob/main/SKILL.md"
"Changelog" = "https://github.com/Torry/ansys-maxwell-motor-skill/blob/main/CHANGELOG.md"

[project.scripts]
# CLI entry points — install via `pip install -e .` to expose as commands
maxwell-winding = "scripts.winding_layout:main"
maxwell-build   = "scripts.main:main"
maxwell-test    = "scripts.test_winding_layouts:main"

# ───────────────────────────────────────────────────────────────────
#  setuptools package config
# ───────────────────────────────────────────────────────────────────

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "scripts.motor_design*"]
exclude = [
    "tests*",
    "examples*",
    "docs*",
    "archive*",
    "debug*",
    "mcp-maxwell*",
    "output_scripts*",
    "projects*",
    "results*",
    "build*",
    "dist*",
    ".git*",
]
namespaces = false

[tool.setuptools.package-data]
"scripts" = ["py.typed"]

# ───────────────────────────────────────────────────────────────────
#  Pytest
# ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--showlocals",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require ANSYS Maxwell installed",
    "mdao: marks MDAO chain tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:win32com",
    "ignore::PendingDeprecationWarning",
]

# ───────────────────────────────────────────────────────────────────
#  Coverage
# ───────────────────────────────────────────────────────────────────

[tool.coverage.run]
branch = true
source = ["scripts"]
omit = [
    "scripts/archive/*",
    "scripts/__pycache__/*",
    "tests/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "def __repr__",
    "\\.\\.\\.",
]

# ───────────────────────────────────────────────────────────────────
#  Ruff (linter + formatter)
# ───────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [
    "archive",
    "build",
    "dist",
    "debug",
    "mcp-maxwell",
    "output_scripts",
    "projects",
    "results",
    ".venv",
    ".git",
]

[tool.ruff.lint]
# Baseline gate: pycodestyle + pyflakes + isort.
# The codebase predates an enforced lint gate (~1.3k legacy findings, most of
# them Chinese full-width punctuation or naming conventions). A baseline lets
# CI catch new regressions now; stricter rules can be re-enabled incrementally.
select = ["E", "W", "F", "I"]
ignore = [
    "E501",  # line too long (we use 110)
    "F841",  # unused variable (legacy code)
    "E701",  # multiple statements on one line (colon)
    "E702",  # multiple statements on one line (semicolon)
    "W293",  # blank line with whitespace (legacy)
    "F541",  # f-string without placeholders (legacy)
    "I001",  # unsorted imports (legacy)
    "F401",  # unused imports (legacy)
    "W292",  # missing newline at end of file (legacy)
    "F811",  # redefined while unused (legacy)
    "W291",  # trailing whitespace (legacy)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "N802", "N803"]   # assert statements, test naming
"examples/*" = ["N802", "N803"]
"scripts/maxwell_bridge.py" = ["N802", "N803"]   # backward compat with COM API

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ───────────────────────────────────────────────────────────────────
#  Mypy
# ───────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = false
disallow_incomplete_defs = false
exclude = [
    "archive/",
    "build/",
    "debug/",
    "mcp-maxwell/",
    "output_scripts/",
    "projects/",
    "results/",
    ".venv/",
]

[[tool.mypy.overrides]]
module = "win32com.*"
ignore_missing_imports = true

# Legacy modules with accumulated type debt. Keep mypy useful for the rest of
# the package and pay this down incrementally; remove entries as they are fixed.
[[tool.mypy.overrides]]
module = [
    "scripts.mdao_orchestrator",
    "scripts.maxwell_bridge",
    "scripts.motor_config",
    "scripts.mcp_connector",
    "scripts.motor_param_calc",
    "scripts.motor_optimizer",
    "scripts.slot_builder",
    "scripts.pm_builder",
    "scripts.main",
    "scripts.winding_layout",
]
ignore_errors = true
